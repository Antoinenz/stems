[package]
name = "stems-sep"
description = "Vocal separation backends for stems (DSP now, ML later)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
onnx = ["dep:ort", "dep:ndarray", "dep:realfft"]
# Load libonnxruntime at runtime (ORT_DYLIB_PATH) instead of linking the
# downloaded static binary; needed where the prebuilt static lib does not
# match the system C++ runtime (e.g. Debian 12 on aarch64).
onnx-dylib = ["onnx", "ort/load-dynamic"]
cuda = ["onnx", "ort/cuda"]
directml = ["onnx", "ort/directml"]
coreml = ["onnx", "ort/coreml"]

[dependencies]
stems-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
hound.workspace = true
ort = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
realfft = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber.workspace = true

[[example]]
name = "mdx_window"
required-features = ["onnx"]

[[example]]
name = "align_smoke"
required-features = ["onnx"]
