[package]
name = "stemsd"
description = "stems daemon: audio receiver, separation pipeline and local server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "stemsd"
path = "src/main.rs"

[features]
default = ["onnx"]
onnx = ["stems-sep/onnx", "dep:futures"]
# load libonnxruntime at runtime from ORT_DYLIB_PATH (see stems-sep)
onnx-dylib = ["onnx", "stems-sep/onnx-dylib"]
cuda = ["onnx", "stems-sep/cuda"]
directml = ["onnx", "stems-sep/directml"]
coreml = ["onnx", "stems-sep/coreml"]

[dependencies]
stems-core.workspace = true
reqwest.workspace = true
futures = { workspace = true, optional = true }
stems-audio.workspace = true
stems-source-file.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
stems-source-spotify.workspace = true
stems-server.workspace = true
stems-enrich.workspace = true
stems-library.workspace = true
ebur128 = "0.1"
stems-sep.workspace = true
rustls.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit = "0.25"
serde_json.workspace = true
rand = "0.9"
directories.workspace = true
