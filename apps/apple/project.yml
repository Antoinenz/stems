# Generate Stems.xcodeproj with `xcodegen` (brew install xcodegen). The
# project file itself is not committed: edit this file instead.
name: Stems
options:
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
packages:
  StemsKit:
    path: StemsKit
targets:
  StemsMac:
    type: application
    platform: macOS
    sources:
      - Mac
    dependencies:
      - package: StemsKit
        product: StemsKit
      - package: StemsKit
        product: StemsUI
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Stems
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: GPL-3.0-or-later
        LSMinimumSystemVersion: "26.0"
    settings:
      base:
        PRODUCT_NAME: Stems
        PRODUCT_BUNDLE_IDENTIFIER: $(STEMS_BUNDLE_PREFIX).stems
        # runs from this Mac only: "Sign to Run Locally", no sandbox (it
        # starts stemsd and reads its config), no notarization
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # dav1d, VideoLAN's AV1 decoder (scripts/build-dav1d.sh), for music
        # videos on Macs without hardware AV1 (before M3)
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/dav1d/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/dav1d/lib
    postBuildScripts:
      - name: Embed stemsd and the web apps
        script: '"$SRCROOT/scripts/embed-server.sh"'
        basedOnDependencyAnalysis: false
        showEnvVars: false
  StemsiOS:
    type: application
    platform: iOS
    sources:
      - iOS
    dependencies:
      - package: StemsKit
        product: StemsKit
      - package: StemsKit
        product: StemsUI
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Stems
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Scan the pairing code your Mac shows.
        NSLocalNetworkUsageDescription: Stems connects to the Mac running your party on this network.
        # plain HTTP to the Mac on the LAN (IPs and .local names)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: stems.pair
            CFBundleURLSchemes:
              - stems
    settings:
      base:
        PRODUCT_NAME: Stems
        PRODUCT_BUNDLE_IDENTIFIER: $(STEMS_BUNDLE_PREFIX).stems.remote
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
schemes:
  StemsMac:
    build:
      targets:
        StemsMac: all
    run:
      config: Debug
    test:
      config: Debug
  StemsiOS:
    build:
      targets:
        StemsiOS: all
    run:
      config: Debug
