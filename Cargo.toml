[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Antoinenz/stems"
rust-version = "1.85"

[workspace.dependencies]
# audio
cpal = "0.18"
rtrb = "0.4"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "flac", "wav", "vorbis", "aac", "isomp4", "ogg", "pcm"] }
hound = "3.5"
rubato = "5.0"

# spotify
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { version = "0.8", default-features = false }
librespot-discovery = { version = "0.8", default-features = false, features = ["with-libmdns", "rustls-tls-native-roots"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-connect = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }

# runtime / cli / logging
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

# server / http
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs", "cors"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }

# config
serde = { version = "1", features = ["derive"] }
toml = "1"
directories = "6"

# internal
stems-core = { path = "crates/stems-core" }
stems-audio = { path = "crates/stems-audio" }
stems-source-file = { path = "crates/stems-source-file" }
stems-source-spotify = { path = "crates/stems-source-spotify" }
stems-server = { path = "crates/stems-server" }
stems-sep = { path = "crates/stems-sep" }
stems-enrich = { path = "crates/stems-enrich" }

[profile.release]
lto = "thin"
codegen-units = 1

# Keep dev builds light: full debuginfo on a 200-crate tree makes linking
# swap on small machines. Our own crates keep line tables for backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
